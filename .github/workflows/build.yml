name: Build JISAN VOICE PRO

on:
  workflow_dispatch:
  push:
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q JISAN_VOICE_PRO_Android_Project.zip -d project

      - name: Build APK
        run: |
          cd project/JisanVoicePro
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JISAN-VOICE-PRO-APK
          path: project/JisanVoicePro/app/build/outputs/apk/debug/app-debug.apk
